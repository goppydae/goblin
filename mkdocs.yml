site_name: Goblin
site_description: Distributed Orchestrator for GAPI (GoPPydae Agent Process Infrastructure)
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
    - scheme: slate
      primary: deep purple
      accent: teal

nav:
  - Home: content/_index.md
  - Usage: content/user/usage.md
  - Architecture: content/architecture.md
  - CLI Reference: content/reference/cli-reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
