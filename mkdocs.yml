site_name: Goblin
site_description: Distributed Orchestrator for GAPI (GoPPydae Agent Process Infrastructure)
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
    - scheme: slate
      primary: deep purple
      accent: teal

nav:
  - Home: index.md
  - Usage: usage.md
  - Architecture: architecture.md
  - CLI Reference: cli-reference.md
  - Ecosystem: ecosystem.md
  - Cluster Validation: cluster_validation.md
  - Cursed Knowledge: cursed-knowledge.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
