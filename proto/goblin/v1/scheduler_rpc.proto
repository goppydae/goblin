syntax = "proto3";

package goblin.v1;

import "goblin/v1/scheduler.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/goppydae/goblin/proto;goblinv1";

// ScaleAgentRequest changes the desired replica count for one spec.
// agent_id accepts either the spec UUID or the operator-facing name,
// matching what the CLI already passes.
message ScaleAgentRequest {
  string agent_id = 1;
  int32 replicas = 2;
}

// ScaleAgentResponse reports applied state rather than a formatted
// sentence. The previous response was a string built with fmt.Sprintf,
// which a caller could only display, never assert on.
message ScaleAgentResponse {
  bytes spec_uuid = 1; // 16-byte UUIDv7 of the scaled spec
  int32 replicas = 2;  // replica count now recorded
}

// ListJobsRequest is empty so fields can be added later without a
// signature change (e.g. a status filter).
message ListJobsRequest {}

// JobInfo is the RPC-facing view of a scheduled job; assembled from the
// job assignment and spec keys at request time rather than stored as
// its own record.
message JobInfo {
  string job_id = 1;
  string assigned_node = 2;
  string agent_type = 3;
  string status = 4;
}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
}

// MembersRequest is empty so fields can be added later without a
// signature change.
message MembersRequest {}

// MemberInfo is the RPC-facing view of a Serf cluster member.
message MemberInfo {
  string name = 1;
  string addr = 2;
  string status = 3;
  map<string, string> tags = 4;
  bool leader = 5;
}

message MembersResponse {
  repeated MemberInfo members = 1;
}

// ListGlobalAgentsRequest is empty so fields can be added later without
// a signature change (e.g. a name filter).
message ListGlobalAgentsRequest {}

message ListGlobalAgentsResponse {
  repeated AgentSpec agents = 1;
}

// ListLocalAgentsRequest is empty so fields can be added later without
// a signature change.
message ListLocalAgentsRequest {}

// LocalAgentInfo is the RPC-facing view of an agent managed by the
// local GAPI agent manager (not a scheduled global agent instance).
message LocalAgentInfo {
  string id = 1;
  string type = 2;
  string state = 3;
  string language = 4;
  int64 uptime_ns = 5;
}

message ListLocalAgentsResponse {
  repeated LocalAgentInfo agents = 1;
}

// GetGlobalAgentRequest identifies one spec. agent_id accepts either
// the spec UUID or the operator-facing name.
message GetGlobalAgentRequest {
  string agent_id = 1;
}

message GetGlobalAgentResponse {
  AgentSpec spec = 1;
}

// GetEventsRequest asks for events with index greater than cursor.
message GetEventsRequest {
  uint64 cursor = 1;
}

// LogEvent is one entry in the in-memory supervisor event log.
message LogEvent {
  uint64 index = 1;
  google.protobuf.Timestamp timestamp = 2;
  string message = 3;
}

message GetEventsResponse {
  repeated LogEvent events = 1;
}

// ListAgentInstancesRequest filters instance listing; empty spec_id
// returns every instance. spec_id accepts either the canonical spec
// UUID or the operator-facing name.
message ListAgentInstancesRequest {
  string spec_id = 1;
}

message ListAgentInstancesResponse {
  repeated AgentInstance instances = 1;
}

// RegisterGlobalAgentRequest registers or updates a global agent spec.
// spec.spec_uuid is server-owned: RegisterAgent mints it from spec.name
// when unset. A caller-supplied spec_uuid is rejected, not overwritten
// (see goblin-typed-rpc-design.md, "Server-owned fields must be
// rejected, not overwritten").
message RegisterGlobalAgentRequest {
  AgentSpec spec = 1;
}

// RegisterGlobalAgentResponse reports the identity assigned to the
// spec rather than a formatted sentence.
message RegisterGlobalAgentResponse {
  bytes spec_uuid = 1; // spec UUID minted (or confirmed) at registration
  string name = 2;
}

// DeleteGlobalAgentRequest identifies the spec to delete. agent_id
// accepts either the spec UUID or the operator-facing name.
message DeleteGlobalAgentRequest {
  string agent_id = 1;
}

// DeleteGlobalAgentResponse reports the identity of the spec that was
// deleted rather than a formatted sentence.
message DeleteGlobalAgentResponse {
  bytes spec_uuid = 1;
  string name = 2;
}

// Job is the RPC-facing view of a job submission - a faithful,
// field-for-field translation of core/scheduler.Job. That type predates
// protobuf and stays a plain Go struct (its storage encoding is JSON in
// the KV store); this message is only the wire shape for SubmitJob.
message Job {
  string id = 1;
  string agent_id = 2;
  string agent_type = 3;
  string assigned_node = 4;
  ResourceReq resources = 5;
  map<string, string> constraints = 6;
  map<string, string> requirements = 7;
  string restart_policy = 8; // "always", "on-failure", "never"
  map<string, string> env = 9;
}

message SubmitJobRequest {
  Job job = 1;
}

// SubmitJobResponse reports where the job landed rather than a
// formatted sentence.
message SubmitJobResponse {
  string job_id = 1;
  string assigned_node = 2;
}

// DrainNodeRequest names the node to evacuate.
message DrainNodeRequest {
  string node_id = 1;
}

message DrainNodeResponse {
  repeated string migrated_job_ids = 1;
}

// PublishEventRequest forwards to membership (Serf) UserEvent. payload
// stays opaque bytes here; typing the event envelope itself is a
// separate piece of work (Serf events), not this one.
message PublishEventRequest {
  string topic = 1;
  bytes payload = 2;
}

// PublishEventResponse confirms the topic that was published rather
// than a formatted sentence.
message PublishEventResponse {
  string topic = 1;
}

// MigrateJobRequest reassigns a job to another node. Distinct from
// MigrateInstanceRequest: this stops work in one place and starts it
// in another, and the process does not survive the move.
message MigrateJobRequest {
  string job_id = 1;
  string to_node = 2;
}

// MigrateJobResponse reports the applied placement rather than a
// formatted sentence.
message MigrateJobResponse {
  string job_id = 1;
  string to_node = 2;
}

// MigrateInstanceRequest asks the leader to live-migrate one running
// instance to another node (GOBLIN-DIV-031). instance_id is the
// canonical UUID string, as goblinctl prints it - not the raw bytes
// spec_uuid/instance_uuid use elsewhere in this schema, since this is
// the field the CLI already passes as a string.
message MigrateInstanceRequest {
  string instance_id = 1;
  string to_node = 2;
}

// MigrateInstanceResponse reports the instance's move rather than a
// formatted sentence.
message MigrateInstanceResponse {
  string instance_id = 1;
  string from_node = 2;
  string to_node = 3;
}

// SignalAgentInstanceRequest asks the leader to signal an instance
// (GOBLIN-DIV-017, DDR-10). instance_id is the canonical UUID string,
// matching MigrateInstanceRequest.
message SignalAgentInstanceRequest {
  string instance_id = 1;
  int32 signum = 2;
}

// SignalAgentInstanceResponse reports the authorized delivery rather
// than a formatted sentence.
message SignalAgentInstanceResponse {
  int32 signum = 1;
  string instance_id = 2;
  string node_id = 3;
}
