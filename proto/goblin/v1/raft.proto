syntax = "proto3";

package goblin.v1;

import "goblin/v1/scheduler.proto";

option go_package = "github.com/goppydae/goblin/proto;goblinv1";

// CommandType defines the operation type for the FSM
enum CommandType {
  // UNSPECIFIED takes the zero value: a LogEntry decoded from data
  // written before this schema (when SET was 0) surfaces as
  // UNSPECIFIED and must be rejected by the FSM, never misapplied.
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SET = 1;
  COMMAND_TYPE_DELETE = 2;
  COMMAND_TYPE_CAS = 3; // Compare-And-Swap
  COMMAND_TYPE_ADMIT = 4;      // admit an instance (payload: admit)
  COMMAND_TYPE_TRANSITION = 5; // lifecycle transition (payload: transition)
  COMMAND_TYPE_SIGNAL = 6;     // authorize + log a signal (payload: signal)
  // Migration is recorded in the log for audit and to arbitrate
  // concurrent attempts, but it is NOT a lifecycle transition: the
  // instance stays RUNNING throughout and only its locator moves.
  COMMAND_TYPE_MIGRATE_BEGIN = 7;  // (payload: migrate_begin)
  COMMAND_TYPE_MIGRATE_COMMIT = 8; // (payload: migrate_commit)
  // Operator key registry (GOBLIN-DIV-015 piece 1). SEED installs the
  // configured root-of-trust keys into an empty registry; CHANGE is a
  // signed add or remove authorized by an already-registered key.
  COMMAND_TYPE_OPERATOR_KEY_SEED = 9;   // (payload: operator_key_seed)
  COMMAND_TYPE_OPERATOR_KEY_CHANGE = 10; // (payload: operator_key_change)
}

// LogEntry represents a command in the Raft log. KV commands use the
// flat namespace/key/value fields; instance-lifecycle commands carry
// their payload in the oneof.
message LogEntry {
  CommandType type = 1;
  string namespace = 2;
  string key = 3;
  bytes value = 4;
  uint64 cas_version = 5; // For optimistic concurrency checks

  oneof payload {
    ApplyAdmit admit = 6;
    InstanceTransition transition = 7;
    SignalRequest signal = 8;
    MigrateBegin migrate_begin = 9;
    MigrateCommit migrate_commit = 10;
    OperatorKeySeed operator_key_seed = 11;
    OperatorKeyChange operator_key_change = 12;
  }
}

// MigrateOutcome closes a migration. UNSPECIFIED is rejected rather
// than treated as either result: a commit whose outcome did not decode
// must not silently move an instance or silently strand it.
enum MigrateOutcome {
  MIGRATE_OUTCOME_UNSPECIFIED = 0;
  MIGRATE_OUTCOME_COMPLETED = 1; // instance now runs on the target
  MIGRATE_OUTCOME_ABORTED = 2;   // rolled back; instance stays put
}

// MigrateBegin records the intent to move one instance to another node
// (research section 4.4, DDR-3/DDR-4).
//
// It does NOT change the instance's lifecycle state. Identity lives in
// Raft and location lives in gossip, so a migration is a locator event;
// the log entry exists for the audit trail (parity with SIGNAL under
// DDR-10) and so the FSM can refuse a second concurrent attempt on the
// same instance.
message MigrateBegin {
  bytes instance_uuid = 1;
  // Where the instance is going. The source is not named: it is
  // whatever node_id the instance record already holds, and taking it
  // from the request would let a stale proposer rewrite history.
  string target_node_id = 2;
  // Which checkpoint this migration will transfer. Increments per
  // dump, so a retried migration never reuses an earlier image.
  uint64 checkpoint_epoch = 3;
  // Rights bitmap from the caller's capability token, checked at the
  // FSM before the migration is admitted (defense in depth, mirroring
  // SignalRequest).
  uint64 rights = 4;
}

// MigrateCommit closes the migration opened by MigrateBegin.
//
// On COMPLETED the instance record's node_id moves to the target. On
// ABORTED it is left untouched: the source restores from the same
// image, which is why a dump stops the process rather than leaving it
// running.
message MigrateCommit {
  bytes instance_uuid = 1;
  // Must match the in-flight migration's epoch. A commit carrying a
  // stale epoch is a late message from a superseded attempt and is
  // rejected rather than applied to the current one.
  uint64 checkpoint_epoch = 2;
  MigrateOutcome outcome = 3;
}

// MigrationRecord is one in-flight migration, carried in the FSM
// snapshot so that concurrency arbitration survives a restart or a
// replica catching up from a snapshot rather than the log.
message MigrationRecord {
  bytes instance_uuid = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  uint64 checkpoint_epoch = 4;
}

// ApplyAdmit admits one instance. The leader mints the UUIDv7 and
// decides placement at PROPOSE time and carries both here: Apply
// records, never generates - the FSM must stay deterministic across
// replicas. The instance enters INSTANCE_STATE_ADMITTED; a tombstoned
// or already-known UUID is rejected.
message ApplyAdmit {
  bytes spec_uuid = 1;
  bytes instance_uuid = 2; // minted at propose time by the leader
  string node_id = 3;      // placement decided at propose time
}

// InstanceTransition moves an instance through the lifecycle FSM.
// Illegal transitions are rejected as the Apply response.
message InstanceTransition {
  bytes instance_uuid = 1;
  InstanceState to = 2;
  string reason = 3; // required for terminal states
}

// SignalRequest commits a signal through the log so it is authorized
// at the FSM (rights bitmap) and audited. Delivery happens on the
// target node through the start_epoch + pidfd guard.
message SignalRequest {
  bytes instance_uuid = 1;
  int32 signum = 2;
  bytes token_id = 3; // authorizing capability token id
  uint64 rights = 4;  // rights asserted; checked against the bitmap
}

// OperatorKeyOp names the mutation an OperatorKeyChangePayload requests.
// UNSPECIFIED is rejected rather than defaulted: a change whose op did
// not decode must not silently become an add.
enum OperatorKeyOp {
  OPERATOR_KEY_OP_UNSPECIFIED = 0;
  OPERATOR_KEY_OP_ADD = 1;
  OPERATOR_KEY_OP_REMOVE = 2;
}

// OperatorKey is one authorized operator identity.
//
// key_id is DERIVED, never asserted: it must equal the lowercase hex
// SHA-256 of public_key, and the FSM refuses a record where it does
// not. Deriving the id from the key removes the class of bug where the
// id names one key and the bytes are another.
message OperatorKey {
  string key_id = 1;    // hex(sha256(public_key))
  bytes public_key = 2; // raw 32-byte Ed25519 public key
  string comment = 3;   // operator-facing label; not authenticated
}

// OperatorKeySeed installs the configured root-of-trust keys.
//
// It carries no signature because there is nothing yet to sign against:
// it is authorized by the registry being empty, which is replicated FSM
// state and therefore a deterministic check. Re-seeding an identical
// set is a no-op so a node restart does not fail; seeding a DIFFERENT
// set into a non-empty registry is refused, which is how config drift
// between nodes surfaces instead of silently widening the trust root.
message OperatorKeySeed {
  repeated OperatorKey keys = 1;
}

// OperatorKeyChangePayload is the signed content of a registry change.
//
// prev_serial is the replay guard and it is deliberately a counter, not
// an expiry: the FSM must decide identically on every replica, and a
// wall-clock comparison inside Apply is not deterministic. A signed
// change is valid at exactly one registry serial.
message OperatorKeyChangePayload {
  OperatorKeyOp op = 1;
  // For ADD, the full record. For REMOVE, only key_id is read; any
  // public_key present is ignored rather than checked, since the
  // registry already holds the authoritative bytes.
  OperatorKey key = 2;
  uint64 prev_serial = 3;
  string authorizing_key_id = 4;
}

// OperatorKeyChange wraps the signed payload. As with CapabilityToken,
// the signature covers the literal payload bytes - protobuf
// serialization is not canonical, so the FSM verifies the bytes that
// arrived in the log and never re-serializes before checking.
message OperatorKeyChange {
  bytes payload = 1;   // serialized OperatorKeyChangePayload
  bytes signature = 2; // Ed25519 over payload bytes
}
