syntax = "proto3";

package goblin.v1;

option go_package = "github.com/goppydae/goblin/proto;goblinv1";

// FSM snapshot (GOBLIN-DIV-040, successor to GOBLIN-DIV-036 piece 3).
// core/consensus/fsm.go Persist/Restore used to speak JSON with a
// hand-rolled SchemaVersion and a legacy bare-map fallback - a private
// versioning scheme doing badly what protobuf does natively, and
// inter-process because the leader ships this to joining nodes over
// Raft. This is a schema reset, not a dual-read upgrade path: a JSON
// snapshot on disk is refused outright (see fsm.go Restore), and there
// is no field here for a legacy encoding to occupy.

// FSMNamespaceState is one namespace's key/value state plus the CAS
// version counters for the same keys. Kept as two parallel maps rather
// than one map of a Value+Version message so the wire shape matches the
// FSM's own in-memory layout (state map, versions map) with no
// per-entry wrapper message.
message FSMNamespaceState {
  map<string, bytes> values = 1;
  map<string, uint64> versions = 2;
}

// FSMSnapshot is the entire Raft FSM state as shipped to a joining node
// or written to the local snapshot store.
message FSMSnapshot {
  // Namespace name -> that namespace's state.
  map<string, FSMNamespaceState> namespaces = 1;

  // Instance UUID (canonical string form) -> marshalled
  // goblin.v1.AgentInstance bytes. The FSM holds these as typed
  // AgentInstance messages; fsm.go marshals each one when it takes a
  // snapshot and unmarshals it again on restore. They are carried as
  // bytes rather than a nested AgentInstance field so this message does
  // not have to import the instance schema.
  map<string, bytes> instances = 2;

  // Every instance UUID ever terminated. Append-only forever (operator
  // decision 2026-07-28): a tombstoned UUID is never reused.
  repeated string tombstones = 3;

  // Instance UUID (canonical string form) -> marshalled
  // goblin.v1.MigrationRecord bytes for in-flight migrations. Same
  // rationale as instances: typed messages in the FSM, marshalled into
  // the snapshot and unmarshalled on restore, kept as bytes so this
  // message does not have to import their schema.
  map<string, bytes> migrations = 4;

  // Operator key id -> marshalled goblin.v1.OperatorKey bytes. Same
  // rationale as instances and migrations: typed messages in the FSM,
  // marshalled into the snapshot and unmarshalled on restore, kept as
  // bytes so this message does not have to import their schema.
  map<string, bytes> operator_keys = 5;

  // The registry's monotone serial. It rides the snapshot because it is
  // the replay guard for signed changes: a leader restored from a
  // snapshot that forgot the serial would accept a change already
  // applied.
  uint64 operator_registry_serial = 6;

  // The PROVENANCE of operator_keys, so a restoring node can authenticate
  // the registry independently of who delivered it (GOBLIN-DIV-047).
  //
  // operator_keys above is a RESULT, and a result is not evidence. A raft
  // peer holding a valid client certificate can forge an FSMSnapshot
  // naming its own key and install it as the cluster's root of trust on
  // every replica, because InstallSnapshot does not pass through Apply
  // and none of the registry's guards run on that path. Transport
  // authentication cannot reach this: the forged snapshot arrives over an
  // authenticated connection like any other.
  //
  // These two fields carry how the registry got to its current state.
  // The seed is the cluster's founding key set, and the chain is every
  // signed change applied since, in apply order. A restoring node replays
  // them from a root it ALREADY HOLDS - the keys its operator configured
  // with --operator-key, which do not come from the snapshot - and
  // refuses unless the replay reproduces operator_keys and
  // operator_registry_serial exactly. A forger cannot produce the
  // signatures, so it cannot produce a chain that replays.
  //
  // Both are marshalled bytes rather than nested messages, matching the
  // convention the fields above already set: this message does not import
  // the schemas it carries.

  // Marshalled goblin.v1.OperatorKeySeed - the founding key set. Unsigned,
  // because a seed is authorized by the registry being empty rather than
  // by a signature; that is exactly why the restoring node must compare it
  // against its OWN configured keys instead of trusting it. Empty when the
  // registry is empty.
  bytes operator_key_seed = 7;

  // Marshalled goblin.v1.OperatorKeyChange records, in the order they were
  // applied. Only changes that actually mutated the registry appear: a
  // re-seed of an identical set and an ADD of an already-registered id are
  // both no-ops that do not bump the serial, so including them would make
  // the replay diverge from the apply path it is reproducing.
  repeated bytes operator_key_chain = 8;
}
