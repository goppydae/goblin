syntax = "proto3";

package goblin.v1;

option go_package = "github.com/goppydae/goblin/proto;goblinv1";

// RPC Request message
message RPCRequest {
  uint32 request_id = 1;
  int64 method = 2;      // e.g. "SchedulerRPC.ListJobs"
  bytes payload = 3;     // Protobuf-encoded request
}

// RPC Response message
message RPCResponse {
  uint32 request_id = 1;
  bool success = 2;
  bytes payload = 3;     // Protobuf-encoded response or error message
  string error = 4;      // Error message if success=false
}

// Stream type enum
enum StreamType {
  STREAM_TYPE_UNSPECIFIED = 0;
  STREAM_TYPE_RPC_REQUEST = 1;
  STREAM_TYPE_RPC_RESPONSE = 2;
  STREAM_TYPE_EVENT_STREAM = 3;
}
