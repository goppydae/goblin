name: Formal Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  integrated-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Validate Evidence Gate
        run: nix develop --command bash tools/cvr/require_evidence_if_code_changed.sh

      - name: Execute Verification Suite
        run: nix develop --command bash tools/verify_all.sh
