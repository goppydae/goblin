name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [gapi-build-success]

jobs:
  full-build-and-test:
    name: Full Build and Test
    runs-on: ubuntu-latest
    env:
      # CI has no sibling checkouts for the committed go.work to
      # resolve; vendored builds are the lone-clone contract.
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi
          token: ${{ secrets.CI_PAT }}

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable



      - name: Compile System Binaries
        working-directory: goblin
        run: nix develop -c mage build

      # The Magefile has carried a govulncheck target since the build
      # library landed, but no workflow ever called it, so CVE drift
      # accumulated as Dependabot alerts instead of failing a build.
      # govulncheck is call-graph filtered: it fails only on a
      # vulnerability this code actually reaches.
      - name: Audit Dependencies for Reachable CVEs
        working-directory: goblin
        run: nix develop -c mage vuln

      # Was 'go test -v ./...', which silently dropped the -race flag the
      # mage target carries (GOBLIN-DIV-035). GOBLIN-DIV-002 records
      # -race finding a real data race the moment it was enabled; running
      # the raw tool put that back out of reach.
      - name: Execute System Tests
        working-directory: goblin
        run: nix develop -c mage test

  no-replace-module-resolution:
    # Proves the ledger exit for the first tagged release: the module
    # graph resolves from published tags alone - no replace directives,
    # no sibling checkouts, no vendor tree, no go.work.
    name: No-Replace Module Resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (lone clone)
        uses: actions/checkout@v4

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Resolve and build from the module proxy
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=mod"
          GOPRIVATE: "github.com/goppydae"
        run: |
          # goppydae modules are private: rewrite fetches through the
          # operator-provided read token (repo secret GOPPYDAE_READ_TOKEN).
          git config --global url."https://x-access-token:${{ secrets.GOPPYDAE_READ_TOKEN }}@github.com/goppydae/".insteadOf "https://github.com/goppydae/"
          rm -rf vendor
          nix develop -c go build ./...

  ecosystem-gates:
    # GOBLIN-DIV-035. The gates existed and no job invoked them, so lint,
    # gosec and schema regressions merged green. This job is the caller.
    #
    # It deliberately needs nothing but this repository. Run 30535030239
    # failed at a sibling checkout on a token scope after 49s, before a
    # single gate executed, taking three gates that need no sibling tree
    # down with it. Anything needing a sibling now lives in shell-doctor.
    name: Ecosystem Gates
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
        with:
          # buf breaking needs a baseline commit to exist locally; the
          # default depth-1 clone has only the tip.
          fetch-depth: 0

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Lint Gate (gofmt, golangci-lint, gosec)
        run: nix develop -c mage lint

      # The Proto target's own baseline is ".git#ref=HEAD", which is
      # correct for a developer comparing an edited tree against the last
      # commit and inert here: a fresh checkout IS HEAD, so the schema
      # would be compared against itself and could never fail. Name a
      # baseline this tree does not equal. This matters most in goblin,
      # where the cluster RPC payloads travel as JSON inside the envelope
      # (GOBLIN-DIV-036) and buf sees only the envelope as it is.
      #
      # A green result on a push proves the job ran, not that it can
      # fail. Only a pull request retyping a field proves that
      # (MAGELIB-DIV-002).
      - name: Schema Gate (buf lint, buf breaking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            export PROTO_BREAKING_AGAINST=".git#ref=$BASE_SHA"
          else
            export PROTO_BREAKING_AGAINST=".git#ref=HEAD~1"
          fi
          nix develop -c mage proto

      # 'mage proto' regenerates into proto/. If the committed output
      # differs from what the pinned plugins produce, the tree is stale
      # and the generated code under review is not the code the schema
      # describes.
      - name: Assert Committed Codegen Is Current
        run: git diff --exit-code

  shell-doctor:
    # The half of GOBLIN-DIV-035 that needs the sibling trees: 'mage
    # doctor' reads them for workspace shape, 'mage envcheck' evaluates
    # all three dev shells to compare tool inventories. This is therefore
    # the only job needing CI_PAT read access to every repository in the
    # silo, and it is split out so that credential fails here alone.
    #
    # Sibling checkouts are for the checks, not module resolution: GOWORK
    # stays off, so the build still resolves through vendor/ exactly as
    # the lone-clone contract requires.
    name: Shell Doctor
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi
          token: ${{ secrets.CI_PAT }}

      - name: Checkout Workspace (Magelib)
        uses: actions/checkout@v4
        with:
          repository: goppydae/magelib
          path: magelib
          token: ${{ secrets.CI_PAT }}

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Five of the six checks are real in CI. The sixth, workspace-shape,
      # only stats the sibling directories this job just created - and its
      # ReplaceTargets list describes replace directives that no longer
      # exist in any go.mod. It proves nothing here; see the note filed
      # against it in the divergence ledger.
      - name: Validate Dev Shell Against Ecosystem Pins
        working-directory: goblin
        run: nix develop -c mage doctor

      - name: Detect Tool Skew Across Sibling Shells
        working-directory: goblin
        run: nix develop -c mage envcheck

  cluster-e2e:
    # The 3-node e2e sits behind the 'cluster' build tag, so 'mage test'
    # reports test/cluster as "[no test files]" and neither CI nor
    # 'mage All' has ever run it. Measured locally over five runs:
    # 28.7s wall, failover 17.85-19.92s against a 30s target, spread
    # quantized by the scheduler's 2s reconciler tick rather than by
    # machine speed - so the margin survives a slower runner.
    name: Cluster E2E (3-node)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi
          token: ${{ secrets.CI_PAT }}

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # quic-go warns "failed to sufficiently increase receive buffer
      # size" on stock runners; the control plane is QUIC over loopback
      # and handshakes drop under the default 208 kiB ceiling. The gapi
      # workflow has needed this since its QUIC tests landed.
      - name: Raise UDP Buffers for the QUIC Control Plane
        run: |
          sudo sysctl -w net.core.rmem_max=7500000
          sudo sysctl -w net.core.wmem_max=7500000

      - name: Execute 3-Node Cluster E2E
        working-directory: goblin
        run: nix develop -c mage testCluster
