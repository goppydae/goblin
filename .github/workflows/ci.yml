name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [gapi-build-success]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goblin
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Gapi
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Nix Cache
        uses: cachix/cachix-action@v13
        with:
          name: goblin
          skipPush: true

      - name: Build
        working-directory: goblin
        run: nix develop -c mage build

      - name: Test
        working-directory: goblin
        run: nix develop -c go test -v ./...
