name: Continuous Integration

# Every target runs under mage -v so the log names each dependency as it
# fires. Without it the run is silent about whether checkHermetic,
# checkTerminology or checkFileLength gated anything - three gates whose
# presence is otherwise indistinguishable from their absence, since a
# wired dependency and a deleted one produce the same green.
#
# This makes the wiring VISIBLE, not enforced. Nothing asserts on the
# line, so removing an mg.Deps still goes green; the log merely records
# what happened instead of staying silent. That residual is recorded in
# GOBLIN-DIV-045 and GOBLIN-DIV-046.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [gapi-build-success]

jobs:
  full-build-and-test:
    name: Full Build and Test
    # Skipped on a repository_dispatch from gapi: this job resolves
    # the kernel through vendor/ at the pinned tag, so re-running it
    # for a kernel change tests goblin against the kernel it already
    # had. integration-against-kernel-main is what that trigger is
    # for (GAPI-DIV-073).
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      # CI has no sibling checkouts for the committed go.work to
      # resolve; vendored builds are the lone-clone contract.
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi
          token: ${{ secrets.GOPPYDAE_READ_TOKEN }}

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable



      - name: Compile System Binaries
        working-directory: goblin
        run: nix develop -c mage -v build

      # The Magefile has carried a govulncheck target since the build
      # library landed, but no workflow ever called it, so CVE drift
      # accumulated as Dependabot alerts instead of failing a build.
      # govulncheck is call-graph filtered: it fails only on a
      # vulnerability this code actually reaches.
      - name: Audit Dependencies for Reachable CVEs
        working-directory: goblin
        run: nix develop -c mage -v vuln

      # The unit suite dials QUIC too - core/transport's shared-listener
      # tests stand up real listeners - and quic-go warns it cannot raise
      # the receive buffer past 2 MiB on a stock runner. The cluster job
      # has raised these since its QUIC tests landed; this job was left
      # out, and run 30725365624 failed here with a valid peer never
      # reaching the raft plane while that warning sat in the log.
      - name: Raise UDP Buffers for the QUIC Control Plane
        run: |
          sudo sysctl -w net.core.rmem_max=7500000
          sudo sysctl -w net.core.wmem_max=7500000

      # Was 'go test -v ./...', which silently dropped the -race flag the
      # mage target carries (GOBLIN-DIV-035). GOBLIN-DIV-002 records
      # -race finding a real data race the moment it was enabled; running
      # the raw tool put that back out of reach.
      - name: Execute System Tests
        working-directory: goblin
        run: nix develop -c mage -v test

  flake-build:
    # The PR-path half of the flake gate. goblin runs 'nix flake check'
    # only in vm-checks.yml, which is deliberately OFF this path and
    # needs KVM - so nothing built the flake package or evaluated the
    # declared systems on a pull request.
    #
    # A FLAKE BUILDS FROM THE GIT TREE, a third resolution mode beside
    # go.work and vendor/. An uncommitted file does not exist to it, so
    # 'nix develop -c go build ./...' can be green while 'nix build .#'
    # fails on the same checkout.
    #
    # --all-systems is the load-bearing flag: a plain check PASSES on
    # outputs that cannot evaluate for a declared system - it omits the
    # incompatible ones, says so in a warning, and exits 0. It is what
    # found that devShells.aarch64-darwin could not be instantiated at
    # all, because criu and libseccomp have no darwin build. --no-build
    # keeps the VM guests out; those stay in vm-checks.yml.
    name: Flake Build
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4

      # No sibling checkout: the flake builds through vendor/ with
      # GOWORK=off, the same resolution the no-replace job proves.

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build the Flake Package
        run: nix build .# --no-link --print-build-logs

      - name: Evaluate Every Declared System
        run: nix flake check --no-build --all-systems

  no-replace-module-resolution:
    # Proves the ledger exit for the first tagged release: the module
    # graph resolves from published tags alone - no replace directives,
    # no sibling checkouts, no vendor tree, no go.work.
    name: No-Replace Module Resolution
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (lone clone)
        uses: actions/checkout@v4

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Resolve and build from the module proxy
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=mod"
          GOPRIVATE: "github.com/goppydae"
        run: |
          # goppydae modules are private: rewrite fetches through the
          # operator-provided read token (repo secret GOPPYDAE_READ_TOKEN).
          git config --global url."https://x-access-token:${{ secrets.GOPPYDAE_READ_TOKEN }}@github.com/goppydae/".insteadOf "https://github.com/goppydae/"
          rm -rf vendor
          nix develop -c go build ./...

  ecosystem-gates:
    # GOBLIN-DIV-035. The gates existed and no job invoked them, so lint,
    # gosec and schema regressions merged green. This job is the caller.
    #
    # This job needs nothing but this repository, and 'mage lint' is not
    # in it despite an earlier commit claiming otherwise: magelib.Lint
    # resolves the shared golangci-lint config from ../magelib (lint.go
    # SharedLintConfig, since neither code repo carries its own
    # .golangci.yml), so lint needs the sibling tree and lives in
    # sibling-gates. Run 30536124119 failed here proving it.
    name: Ecosystem Gates
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
        with:
          # buf breaking needs a baseline commit to exist locally; the
          # default depth-1 clone has only the tip.
          fetch-depth: 0

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The Proto target's own baseline is ".git#ref=HEAD", which is
      # correct for a developer comparing an edited tree against the last
      # commit and inert here: a fresh checkout IS HEAD, so the schema
      # would be compared against itself and could never fail. Name a
      # baseline this tree does not equal. This matters most in goblin,
      # where the cluster RPC payloads travel as JSON inside the envelope
      # (GOBLIN-DIV-036) and buf sees only the envelope as it is.
      #
      # A green result on a push proves the job ran, not that it can
      # fail. Only a pull request retyping a field proves that
      # (MAGELIB-DIV-002).
      #
      # An operator-approved wire break (pre-1.0 schema reset) cannot
      # pass a comparison against its own merge base by design. The
      # 'schema-reset' label is the CI face of PROTO_BREAKING_SKIP: the
      # operator applies it by hand to the one PR carrying the break,
      # the skip is loud in the run log, and buf lint plus codegen still
      # run. The label does not exist on pushes, so the main-branch gate
      # can never be skipped this way.
      - name: Schema Gate (buf lint, buf breaking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCHEMA_RESET: ${{ contains(github.event.pull_request.labels.*.name, 'schema-reset') && '1' || '' }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            export PROTO_BREAKING_AGAINST=".git#ref=$BASE_SHA"
          else
            export PROTO_BREAKING_AGAINST=".git#ref=HEAD~1"
          fi
          if [ -n "$SCHEMA_RESET" ]; then
            echo "::warning::schema-reset label present: buf breaking SKIPPED for this operator-approved wire break"
            export PROTO_BREAKING_SKIP=1
          fi
          nix develop -c mage -v proto

      # 'mage proto' regenerates into proto/. If the committed output
      # differs from what the pinned plugins produce, the tree is stale
      # and the generated code under review is not the code the schema
      # describes.
      - name: Assert Committed Codegen Is Current
        run: git diff --exit-code

  sibling-gates:
    # The half of GOBLIN-DIV-035 that needs the sibling trees:
    #   lint     - magelib.Lint reads ../magelib/.golangci.yml, the shared
    #              config both code repos consume instead of carrying one
    #   doctor   - reads the sibling directories for workspace shape
    #   envcheck - evaluates all three dev shells to compare inventories
    #
    # This is therefore the only job needing cross-repo credentials, and it
    # is split out so a credential problem fails here alone rather than
    # taking the schema gate with it. It uses GOPPYDAE_READ_TOKEN, not
    # CI_PAT: the read token is scoped to exactly these three repos with
    # contents-read and nothing else, while CI_PAT carries the write access
    # the repository-dispatch step needs. Three runs failed here against
    # CI_PAT, which does not list magelib.
    #
    # Sibling checkouts are for the checks, not module resolution: GOWORK
    # stays off, so the build still resolves through vendor/ exactly as
    # the lone-clone contract requires.
    name: Sibling Gates
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi
          token: ${{ secrets.GOPPYDAE_READ_TOKEN }}

      - name: Checkout Workspace (Magelib)
        uses: actions/checkout@v4
        with:
          repository: goppydae/magelib
          path: magelib
          token: ${{ secrets.GOPPYDAE_READ_TOKEN }}

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Five of the six checks are real in CI. The sixth, workspace-shape,
      # only stats the sibling directories this job just created - and its
      # ReplaceTargets list describes replace directives that no longer
      # exist in any go.mod. It proves nothing here; see the note filed
      # against it in the divergence ledger.
      - name: Validate Dev Shell Against Ecosystem Pins
        working-directory: goblin
        run: nix develop -c mage -v doctor

      - name: Detect Tool Skew Across Sibling Shells
        working-directory: goblin
        run: nix develop -c mage -v envcheck

      # Needs ../magelib for the shared golangci-lint config, which is why
      # it is here and not in ecosystem-gates.
      - name: Lint Gate (gofmt, golangci-lint, gosec)
        working-directory: goblin
        run: nix develop -c mage -v lint

  cluster-e2e:
    # The 3-node e2e sits behind the 'cluster' build tag, so 'mage test'
    # reports test/cluster as "[no test files]" and neither CI nor
    # 'mage All' has ever run it. Measured locally over five runs:
    # 28.7s wall, failover 17.85-19.92s against a 30s target, spread
    # quantized by the scheduler's 2s reconciler tick rather than by
    # machine speed - so the margin survives a slower runner.
    name: Cluster E2E (3-node)
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      - name: Checkout Workspace (Gapi)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          path: gapi
          token: ${{ secrets.GOPPYDAE_READ_TOKEN }}

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # quic-go warns "failed to sufficiently increase receive buffer
      # size" on stock runners; the control plane is QUIC over loopback
      # and handshakes drop under the default 208 kiB ceiling. The gapi
      # workflow has needed this since its QUIC tests landed.
      - name: Raise UDP Buffers for the QUIC Control Plane
        run: |
          sudo sysctl -w net.core.rmem_max=7500000
          sudo sysctl -w net.core.wmem_max=7500000

      - name: Execute 3-Node Cluster E2E
        working-directory: goblin
        run: nix develop -c mage -v testCluster

  # GAPI-DIV-073. gapi's main build dispatches gapi-build-success here,
  # and every job above USED to re-run for it - each resolving the kernel
  # through vendor/ at the pinned tag, so the run could not fail for the
  # change that triggered it. Eleven of forty runs, ~28% of this repo's
  # CI, re-testing goblin against the kernel it already had.
  #
  # This job is what the trigger always claimed to be, and it is now the
  # only one a dispatch runs. It is also the only job that resolves the
  # kernel LIVE: go.work names ., ../gapi and ../magelib, so all three
  # are checked out and GOWORK stays ON.
  #
  # It does not replace the pinned path. That is the lone-clone contract,
  # and full-build-and-test plus no-replace-module-resolution still prove
  # it on every push and pull request. Two jobs, two resolutions, two
  # meanings.
  integration-against-kernel-main:
    name: Integration Against Kernel Main
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      # FAIL LOUDLY IF THE PAYLOAD IS ABSENT. actions/checkout treats an
      # empty ref as "the default branch", so without this a dispatch
      # from a gapi that does not send the sha would silently test main
      # and report a green attributed to a commit it never built. That
      # is the shape this whole entry is about, reintroduced one layer
      # down.
      - name: Require The Triggering Commit
        run: |
          if [ -z "${{ github.event.client_payload.sha }}" ]; then
            echo "::error::dispatch carried no client_payload.sha, so there is no"
            echo "::error::kernel commit to test against. gapi's Trigger Goblin CI"
            echo "::error::step must send it (GAPI-DIV-073)."
            exit 1
          fi

      - name: Checkout Workspace (Goblin)
        uses: actions/checkout@v4
        with:
          path: goblin

      # The EXACT kernel commit that triggered this, not whatever main
      # happens to be by the time the runner starts. A gate whose purpose
      # is naming what broke has to name the commit it tested, and main
      # can move between the dispatch and the checkout.
      - name: Checkout Workspace (Gapi, the triggering commit)
        uses: actions/checkout@v4
        with:
          repository: goppydae/gapi
          ref: ${{ github.event.client_payload.sha }}
          path: gapi

      # go.work names ../magelib as well, so live resolution needs it
      # present or the workspace does not load at all.
      #
      # No token on either sibling: all three repos are public, so a
      # cross-repo checkout needs no credential.
      - name: Checkout Workspace (Magelib)
        uses: actions/checkout@v4
        with:
          repository: goppydae/magelib
          path: magelib

      - name: Synchronize Environment (Nix)
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Report What Is Under Test
        run: |
          echo "goblin  $(git -C goblin rev-parse --short HEAD)"
          echo "gapi    $(git -C gapi rev-parse --short HEAD)  (triggering commit)"
          echo "magelib $(git -C magelib rev-parse --short HEAD)"

      # GOWORK is deliberately NOT "off" in this job. That is the job.
      - name: Build Against The Kernel's Working Tree
        working-directory: goblin
        run: nix develop -c go build ./...

      - name: Vet Against The Kernel's Working Tree
        working-directory: goblin
        run: nix develop -c go vet ./...

      - name: Test Against The Kernel's Working Tree
        working-directory: goblin
        run: nix develop -c go test ./internal/... ./core/...

      # RESIDUAL 1 of GAPI-DIV-073: a live build can fail for goblin's
      # reasons as well as the kernel's, and a bare red is ambiguous
      # between them. Say which this is.
      - name: Name What This Failure Means
        if: failure()
        run: |
          echo "::error::goblin's tree does not build, vet or pass against gapi at ${{ github.event.client_payload.sha }}."
          echo "::error::This does NOT mean goblin main is broken. goblin's own push and"
          echo "::error::pull-request runs resolve the kernel through vendor/ at the pinned"
          echo "::error::tag and are unaffected."
          echo "::error::It means the NEXT re-vendor of gapi into goblin carries this failure"
          echo "::error::unless the kernel change is amended or goblin adapts to it."
